<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>D4 · 深色模式差异化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-primary:#60A5FA;
  --c-primary-hover:#93C5FD;
  --c-primary-light:rgba(96,165,250,0.15);
  --c-page:#0F172A;
  --c-panel:#1E293B;
  --c-line:#334155;
  --c-text:#E2E8F0;
  --c-text-regular:#CBD5E1;
  --c-text-secondary:#94A3B8;
  --c-text-placeholder:#64748B;
  --c-nav:#020617;
  --c-nav-text:#F1F5F9;
  --c-danger:#F87171;
  --radius:8px;
  --shadow-card:0 0 30px rgba(0,0,0,0.4);
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px; --sp-2xl:32px;
  --fs-12:12px; --fs-14:14px; --fs-16:16px; --fs-20:20px; --fs-24:24px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--c-page);color:var(--c-text);font-size:var(--fs-14);}
body{display:flex;flex-direction:column;overflow:hidden;}
.topnav{height:56px;background:var(--c-nav);color:var(--c-nav-text);border-bottom:1px solid var(--c-line);display:flex;align-items:center;padding:0 var(--sp-xl);flex-shrink:0;}
.topnav-left{display:flex;align-items:center;gap:var(--sp-xl);}
.logo{font-size:var(--fs-16);font-weight:600;letter-spacing:.3px;color:var(--c-nav-text);}
.subnav{display:flex;gap:var(--sp-lg);}
.subnav-item{font-size:var(--fs-14);color:var(--c-text-secondary);padding:var(--sp-sm) 0;cursor:pointer;border-bottom:2px solid transparent;}
.subnav-item.active{color:var(--c-primary);border-bottom-color:var(--c-primary);}
.user{margin-left:auto;display:flex;align-items:center;gap:var(--sp-sm);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--c-primary);color:#0F172A;display:flex;align-items:center;justify-content:center;font-size:var(--fs-14);font-weight:700;}
.main{display:flex;flex:1;overflow:hidden;}
.left{width:240px;background:var(--c-panel);border-right:1px solid var(--c-line);padding:var(--sp-lg);overflow-y:auto;flex-shrink:0;}
.left-group{margin-bottom:var(--sp-xl);}
.left-title{font-size:var(--fs-12);color:var(--c-text-secondary);font-weight:600;margin-bottom:var(--sp-sm);letter-spacing:.5px;}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-sm);}
.chip{height:36px;border:1px solid var(--c-line);background:#0F172A;border-radius:var(--radius);font-size:var(--fs-12);color:var(--c-text-regular);cursor:pointer;transition:all .15s;}
.chip:hover{border-color:var(--c-primary);background:var(--c-primary-light);color:var(--c-primary);}
.center{flex:1;display:flex;flex-direction:column;background:var(--c-page);overflow:hidden;}
.center-body{flex:1;padding:var(--sp-xl);overflow-y:auto;}
.tabs{display:flex;gap:var(--sp-sm);margin-bottom:var(--sp-lg);align-items:center;}
.tab{height:32px;padding:0 var(--sp-lg);border:none;background:transparent;font-size:var(--fs-14);color:var(--c-text-secondary);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--c-primary);border-bottom-color:var(--c-primary);}
.tab-add{height:32px;width:32px;border:none;background:transparent;color:var(--c-text-secondary);cursor:pointer;font-size:var(--fs-16);}
.form-title{display:block;width:100%;height:44px;padding:0 var(--sp-md);border:1px solid var(--c-line);background:var(--c-panel);border-radius:var(--radius);font-size:var(--fs-16);font-weight:600;color:var(--c-text);margin-bottom:var(--sp-lg);}
.form-title:focus{outline:none;border-color:var(--c-primary);}
.card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:var(--sp-lg);margin-bottom:var(--sp-md);}
.card-head{display:flex;align-items:center;gap:var(--sp-sm);margin-bottom:var(--sp-md);}
.card-num{color:var(--c-text-secondary);font-weight:500;}
.card-title{flex:1;height:32px;padding:0 var(--sp-sm);border:none;background:transparent;font-size:var(--fs-14);font-weight:500;color:var(--c-text);border-bottom:1px solid transparent;}
.card-title:focus{outline:none;border-bottom-color:var(--c-primary);}
.required{color:var(--c-danger);font-size:var(--fs-16);}
.card-options{display:flex;flex-direction:column;gap:var(--sp-sm);padding:var(--sp-sm) 0 0 var(--sp-xl);margin-bottom:var(--sp-md);}
.opt{display:flex;align-items:center;gap:var(--sp-sm);font-size:var(--fs-14);color:var(--c-text-regular);cursor:pointer;}
.opt input{accent-color:var(--c-primary);}
.card-tools{display:flex;align-items:center;gap:var(--sp-lg);padding-top:var(--sp-sm);border-top:1px solid var(--c-line);font-size:var(--fs-12);color:var(--c-text-secondary);}
.tool-check{display:flex;align-items:center;gap:var(--sp-xs);cursor:pointer;}
.tool-check input{accent-color:var(--c-primary);}
.tool-btn{padding:var(--sp-xs) var(--sp-sm);background:transparent;border:none;color:var(--c-text-secondary);cursor:pointer;border-radius:4px;}
.tool-btn:hover{color:var(--c-text);}
.tool-btn.tool-danger:hover{color:var(--c-danger);}
.add-q{display:block;width:100%;height:48px;border:1px dashed var(--c-line);background:transparent;border-radius:var(--radius);color:var(--c-text-secondary);font-size:var(--fs-14);cursor:pointer;margin-bottom:var(--sp-sm);transition:all .15s;}
.add-q:hover{border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-light);}
.add-card{display:block;width:100%;height:48px;border:1px dashed var(--c-line);background:transparent;border-radius:var(--radius);color:var(--c-text-secondary);font-size:var(--fs-14);cursor:pointer;margin-bottom:var(--sp-md);transition:all .15s;}
.add-card:hover{border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-light);}
.center-foot{height:56px;background:var(--c-panel);border-top:1px solid var(--c-line);display:flex;align-items:center;padding:0 var(--sp-xl);flex-shrink:0;}
.save-hint{font-size:var(--fs-12);color:var(--c-text-secondary);}
.actions{margin-left:auto;display:flex;gap:var(--sp-sm);}
.btn-ghost,.btn-secondary,.btn-primary{height:32px;padding:0 var(--sp-lg);border-radius:var(--radius);font-size:var(--fs-14);cursor:pointer;border:1px solid var(--c-line);background:transparent;color:var(--c-text-regular);}
.btn-ghost:hover{color:var(--c-danger);border-color:var(--c-danger);}
.btn-secondary{color:var(--c-primary);border-color:var(--c-primary);}
.btn-secondary:hover{background:var(--c-primary-light);}
.btn-primary{background:var(--c-primary);color:#0F172A;border-color:var(--c-primary);font-weight:600;}
.btn-primary:hover{background:var(--c-primary-hover);border-color:var(--c-primary-hover);}
.right{width:320px;background:var(--c-panel);border-left:1px solid var(--c-line);padding:var(--sp-lg);overflow-y:auto;flex-shrink:0;}
.panel-title{font-size:var(--fs-14);font-weight:600;margin-bottom:var(--sp-lg);padding-bottom:var(--sp-sm);border-bottom:1px solid var(--c-line);}
.panel-row{margin-bottom:var(--sp-md);}
.panel-row>label{display:block;font-size:var(--fs-12);color:var(--c-text-secondary);margin-bottom:var(--sp-xs);}
.panel-row input,.panel-row select,.panel-row textarea{width:100%;padding:var(--sp-sm);border:1px solid var(--c-line);border-radius:4px;font-size:var(--fs-14);color:var(--c-text);background:#0F172A;font-family:inherit;}
.panel-row textarea{resize:vertical;min-height:64px;}
.panel-row input:focus,.panel-row select:focus,.panel-row textarea:focus{outline:none;border-color:var(--c-primary);}
.seg{display:flex;border:1px solid var(--c-line);border-radius:4px;overflow:hidden;}
.seg-item{flex:1;height:32px;background:transparent;border:none;font-size:var(--fs-12);color:var(--c-text-regular);cursor:pointer;border-right:1px solid var(--c-line);}
.seg-item:last-child{border-right:none;}
.seg-item.active{background:var(--c-primary-light);color:var(--c-primary);}
.switch{width:36px;height:20px;background:var(--c-line);border-radius:10px;position:relative;cursor:pointer;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#E2E8F0;border-radius:50%;transition:.2s;}
.switch.on{background:var(--c-primary);}
.switch.on::after{left:18px;background:#0F172A;}
.panel-section{margin-top:var(--sp-lg);padding-top:var(--sp-lg);border-top:1px solid var(--c-line);}
.panel-section-title{font-size:var(--fs-12);font-weight:600;color:var(--c-text-secondary);margin-bottom:var(--sp-sm);}
.check{display:flex;align-items:center;gap:var(--sp-xs);font-size:var(--fs-14);color:var(--c-text-regular);padding:var(--sp-xs) 0;cursor:pointer;}
.check input{accent-color:var(--c-primary);}
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-left">
    <div class="logo">表单中台</div>
    <nav class="subnav">
      <div class="subnav-item active">表单设置</div>
      <div class="subnav-item">应用端数据</div>
    </nav>
  </div>
  <div class="user">
    <div class="avatar">张</div>
    <span>张三</span>
  </div>
</header>
<div class="main">
  <aside class="left">
    <div class="left-group">
      <div class="left-title">选择</div>
      <div class="chips">
        <button class="chip">单选</button><button class="chip">多选</button>
        <button class="chip">单选打分</button><button class="chip">多选打分</button>
      </div>
    </div>
    <div class="left-group">
      <div class="left-title">填空</div>
      <div class="chips">
        <button class="chip">单行文本</button><button class="chip">多行文本</button>
        <button class="chip">数字</button><button class="chip">日期时间</button>
      </div>
    </div>
    <div class="left-group">
      <div class="left-title">采集</div>
      <div class="chips">
        <button class="chip">图片</button><button class="chip">标签文本</button>
        <button class="chip">列表</button><button class="chip">富文本</button>
      </div>
    </div>
  </aside>
  <main class="center">
    <div class="center-body">
      <div class="tabs">
        <button class="tab active">第 1 页</button>
        <button class="tab-add">+</button>
      </div>
      <input class="form-title" value="客户满意度调研问卷">
      <div class="card">
        <div class="card-head">
          <span class="card-num">1.</span>
          <input class="card-title" value="请问您对本次服务总体满意程度">
          <span class="required">*</span>
        </div>
        <div class="card-options">
          <label class="opt"><input type="radio" name="q1"><span>非常满意</span></label>
          <label class="opt"><input type="radio" name="q1"><span>满意</span></label>
          <label class="opt"><input type="radio" name="q1"><span>一般</span></label>
        </div>
        <div class="card-tools">
          <label class="tool-check"><input type="checkbox" checked>必填</label>
          <button class="tool-btn">复制</button>
          <button class="tool-btn tool-danger">删除</button>
        </div>
      </div>
      <button class="add-q">+ 添加题目</button>
      <button class="add-card">+ 添加卡片</button>
    </div>
    <footer class="center-foot">
      <span class="save-hint">最近保存：2026-07-22 18:15</span>
      <div class="actions">
        <button class="btn-ghost">重置</button>
        <button class="btn-secondary">预览</button>
        <button class="btn-primary">保存</button>
      </div>
    </footer>
  </main>
  <aside class="right">
    <div class="panel-title">基础·单选</div>
    <div class="panel-row"><label>题干</label><input value="请问您对本次服务总体满意程度"></div>
    <div class="panel-row"><label>题目说明</label><textarea placeholder="选填，补充说明"></textarea></div>
    <div class="panel-row"><label>题型</label><select><option>单选</option><option>多选</option></select></div>
    <div class="panel-row"><label>选项排列</label><div class="seg"><button class="seg-item active">单列</button><button class="seg-item">双列</button></div></div>
    <div class="panel-row"><label>必填</label><div class="switch on"></div></div>
    <div class="panel-section">
      <div class="panel-section-title">数据源</div>
      <label class="check"><input type="checkbox">允许清空</label>
      <label class="check"><input type="checkbox">设为查询条件</label>
      <label class="check"><input type="checkbox">在列表中显示</label>
    </div>
  </aside>
</div>
</body>
</html>
