<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>D2 · Tally 极简现代</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-primary:#5B8FF9;
  --c-primary-hover:#4A7EE8;
  --c-primary-light:#EDF3FE;
  --c-page:#FAFAFA;
  --c-panel:#FFFFFF;
  --c-line:transparent;
  --c-line-hover:#E5E7EB;
  --c-text:#111827;
  --c-text-regular:#4B5563;
  --c-text-secondary:#9CA3AF;
  --c-nav:#FFFFFF;
  --c-nav-text:#111827;
  --c-danger:#EF4444;
  --radius:10px;
  --shadow-card:0 1px 2px rgba(0,0,0,0.04);
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px; --sp-2xl:32px; --sp-3xl:48px;
  --fs-12:12px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-24:24px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--c-page);color:var(--c-text);font-size:var(--fs-14);}
body{display:flex;flex-direction:column;overflow:hidden;}
.topnav{height:56px;background:var(--c-nav);color:var(--c-nav-text);border-bottom:1px solid var(--c-line-hover);display:flex;align-items:center;padding:0 var(--sp-3xl);flex-shrink:0;}
.topnav-left{display:flex;align-items:center;gap:var(--sp-3xl);}
.logo{font-size:var(--fs-18);font-weight:700;letter-spacing:-.3px;}
.subnav{display:flex;gap:var(--sp-xl);}
.subnav-item{font-size:var(--fs-14);color:var(--c-text-secondary);padding:var(--sp-sm) 0;cursor:pointer;border-bottom:2px solid transparent;}
.subnav-item.active{color:var(--c-text);border-bottom-color:var(--c-text);}
.user{margin-left:auto;display:flex;align-items:center;gap:var(--sp-sm);font-size:var(--fs-14);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-14);font-weight:600;}
.main{display:flex;flex:1;overflow:hidden;}
.left{width:240px;background:var(--c-panel);padding:var(--sp-xl) var(--sp-lg);overflow-y:auto;flex-shrink:0;}
.left-group{margin-bottom:var(--sp-2xl);}
.left-title{font-size:var(--fs-12);color:var(--c-text-secondary);font-weight:500;margin-bottom:var(--sp-md);letter-spacing:.3px;}
.chips{display:flex;flex-direction:column;gap:var(--sp-sm);}
.chip{height:40px;border:none;background:#F3F4F6;border-radius:var(--radius);font-size:var(--fs-14);color:var(--c-text-regular);cursor:pointer;transition:all .15s;text-align:left;padding:0 var(--sp-md);}
.chip:hover{background:var(--c-primary-light);color:var(--c-primary);}
.center{flex:1;display:flex;flex-direction:column;background:var(--c-page);overflow:hidden;}
.center-body{flex:1;padding:var(--sp-3xl);overflow-y:auto;max-width:760px;margin:0 auto;width:100%;}
.tabs{display:flex;gap:var(--sp-md);margin-bottom:var(--sp-xl);}
.tab{height:36px;padding:0 var(--sp-lg);border:none;background:transparent;font-size:var(--fs-14);color:var(--c-text-secondary);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--c-text);border-bottom-color:var(--c-text);font-weight:500;}
.tab-add{height:36px;width:36px;border:none;background:transparent;color:var(--c-text-secondary);cursor:pointer;font-size:var(--fs-18);}
.form-title{display:block;width:100%;height:auto;padding:var(--sp-md) 0;border:none;background:transparent;font-size:var(--fs-24);font-weight:700;color:var(--c-text);margin-bottom:var(--sp-2xl);border-bottom:1px solid var(--c-line-hover);border-radius:0;}
.form-title:focus{outline:none;border-bottom-color:var(--c-primary);}
.card{background:var(--c-panel);padding:var(--sp-2xl);border-radius:var(--radius);margin-bottom:var(--sp-md);transition:box-shadow .2s;}
.card:hover{box-shadow:var(--shadow-card);}
.card-head{display:flex;align-items:center;gap:var(--sp-md);margin-bottom:var(--sp-lg);}
.card-num{color:var(--c-text-secondary);font-weight:500;}
.card-title{flex:1;height:auto;padding:var(--sp-sm) 0;border:none;background:transparent;font-size:var(--fs-18);font-weight:600;color:var(--c-text);border-bottom:1px solid var(--c-line-hover);}
.card-title:focus{outline:none;border-bottom-color:var(--c-primary);}
.required{color:var(--c-danger);font-size:var(--fs-18);}
.card-options{display:flex;flex-direction:column;gap:var(--sp-md);padding:var(--sp-md) 0;margin-bottom:var(--sp-md);}
.opt{display:flex;align-items:center;gap:var(--sp-md);font-size:var(--fs-16);color:var(--c-text-regular);cursor:pointer;padding:var(--sp-sm) 0;}
.opt input{accent-color:var(--c-primary);width:18px;height:18px;}
.card-tools{display:flex;align-items:center;gap:var(--sp-xl);padding-top:var(--sp-md);border-top:1px solid var(--c-line-hover);font-size:var(--fs-12);color:var(--c-text-secondary);}
.tool-check{display:flex;align-items:center;gap:var(--sp-xs);cursor:pointer;}
.tool-check input{accent-color:var(--c-primary);}
.tool-btn{padding:var(--sp-xs) 0;background:transparent;border:none;color:var(--c-text-secondary);cursor:pointer;}
.tool-btn:hover{color:var(--c-text);}
.tool-btn.tool-danger:hover{color:var(--c-danger);}
.add-q{display:block;width:100%;height:56px;border:1px dashed var(--c-line-hover);background:transparent;border-radius:var(--radius);color:var(--c-text-secondary);font-size:var(--fs-14);cursor:pointer;margin-bottom:var(--sp-sm);transition:all .15s;}
.add-q:hover{border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-light);}
.add-card{display:block;width:100%;height:56px;border:1px dashed var(--c-line-hover);background:transparent;border-radius:var(--radius);color:var(--c-text-secondary);font-size:var(--fs-14);cursor:pointer;margin-bottom:var(--sp-md);transition:all .15s;}
.add-card:hover{border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-light);}
.center-foot{height:56px;background:var(--c-panel);border-top:1px solid var(--c-line-hover);display:flex;align-items:center;padding:0 var(--sp-3xl);flex-shrink:0;}
.save-hint{font-size:var(--fs-12);color:var(--c-text-secondary);}
.actions{margin-left:auto;display:flex;gap:var(--sp-sm);}
.btn-ghost,.btn-secondary,.btn-primary{height:40px;padding:0 var(--sp-xl);border-radius:var(--radius);font-size:var(--fs-14);cursor:pointer;border:none;background:transparent;color:var(--c-text-regular);font-weight:500;}
.btn-ghost:hover{color:var(--c-text);}
.btn-secondary{color:var(--c-text-regular);}
.btn-secondary:hover{color:var(--c-text);}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-hover);}
.right{width:320px;background:var(--c-panel);padding:var(--sp-xl) var(--sp-lg);overflow-y:auto;flex-shrink:0;border-left:1px solid var(--c-line-hover);}
.panel-title{font-size:var(--fs-12);color:var(--c-text-secondary);font-weight:500;margin-bottom:var(--sp-xl);letter-spacing:.5px;text-transform:uppercase;}
.panel-row{margin-bottom:var(--sp-lg);}
.panel-row>label{display:block;font-size:var(--fs-12);color:var(--c-text-secondary);margin-bottom:var(--sp-sm);}
.panel-row input,.panel-row select,.panel-row textarea{width:100%;padding:var(--sp-sm) 0;border:none;background:transparent;font-size:var(--fs-14);color:var(--c-text);border-bottom:1px solid var(--c-line-hover);font-family:inherit;border-radius:0;}
.panel-row textarea{resize:vertical;min-height:64px;}
.panel-row input:focus,.panel-row select:focus,.panel-row textarea:focus{outline:none;border-bottom-color:var(--c-primary);}
.seg{display:flex;background:#F3F4F6;border-radius:var(--radius);padding:3px;}
.seg-item{flex:1;height:32px;background:transparent;border:none;font-size:var(--fs-14);color:var(--c-text-regular);cursor:pointer;border-radius:7px;}
.seg-item.active{background:#fff;color:var(--c-text);box-shadow:0 1px 2px rgba(0,0,0,0.06);}
.switch{width:36px;height:20px;background:#E5E7EB;border-radius:10px;position:relative;cursor:pointer;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s;}
.switch.on{background:var(--c-primary);}
.switch.on::after{left:18px;}
.panel-section{margin-top:var(--sp-xl);padding-top:var(--sp-xl);border-top:1px solid var(--c-line-hover);}
.panel-section-title{font-size:var(--fs-12);color:var(--c-text-secondary);font-weight:500;margin-bottom:var(--sp-md);}
.check{display:flex;align-items:center;gap:var(--sp-sm);font-size:var(--fs-14);color:var(--c-text-regular);padding:var(--sp-sm) 0;cursor:pointer;}
.check input{accent-color:var(--c-primary);width:16px;height:16px;}
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-left">
    <div class="logo">表单中台</div>
    <nav class="subnav">
      <div class="subnav-item active">表单设置</div>
      <div class="subnav-item">应用端数据</div>
    </nav>
  </div>
  <div class="user">
    <div class="avatar">张</div>
    <span>张三</span>
  </div>
</header>
<div class="main">
  <aside class="left">
    <div class="left-group">
      <div class="left-title">选择</div>
      <div class="chips">
        <button class="chip">单选</button><button class="chip">多选</button>
        <button class="chip">单选打分</button><button class="chip">多选打分</button>
      </div>
    </div>
    <div class="left-group">
      <div class="left-title">填空</div>
      <div class="chips">
        <button class="chip">单行文本</button><button class="chip">多行文本</button>
        <button class="chip">数字</button><button class="chip">日期时间</button>
      </div>
    </div>
    <div class="left-group">
      <div class="left-title">采集</div>
      <div class="chips">
        <button class="chip">图片</button><button class="chip">标签文本</button>
        <button class="chip">列表</button><button class="chip">富文本</button>
      </div>
    </div>
  </aside>
  <main class="center">
    <div class="center-body">
      <div class="tabs">
        <button class="tab active">第 1 页</button>
        <button class="tab-add">+</button>
      </div>
      <input class="form-title" value="客户满意度调研问卷">
      <div class="card">
        <div class="card-head">
          <span class="card-num">1.</span>
          <input class="card-title" value="请问您对本次服务总体满意程度">
          <span class="required">*</span>
        </div>
        <div class="card-options">
          <label class="opt"><input type="radio" name="q1"><span>非常满意</span></label>
          <label class="opt"><input type="radio" name="q1"><span>满意</span></label>
          <label class="opt"><input type="radio" name="q1"><span>一般</span></label>
        </div>
        <div class="card-tools">
          <label class="tool-check"><input type="checkbox" checked>必填</label>
          <button class="tool-btn">复制</button>
          <button class="tool-btn tool-danger">删除</button>
        </div>
      </div>
      <button class="add-q">+ 添加题目</button>
      <button class="add-card">+ 添加卡片</button>
    </div>
    <footer class="center-foot">
      <span class="save-hint">最近保存：2026-07-22 18:15</span>
      <div class="actions">
        <button class="btn-ghost">重置</button>
        <button class="btn-secondary">预览</button>
        <button class="btn-primary">保存</button>
      </div>
    </footer>
  </main>
  <aside class="right">
    <div class="panel-title">基础 · 单选</div>
    <div class="panel-row"><label>题干</label><input value="请问您对本次服务总体满意程度"></div>
    <div class="panel-row"><label>题目说明</label><textarea placeholder="选填，补充说明"></textarea></div>
    <div class="panel-row"><label>题型</label><select><option>单选</option><option>多选</option></select></div>
    <div class="panel-row"><label>选项排列</label><div class="seg"><button class="seg-item active">单列</button><button class="seg-item">双列</button></div></div>
    <div class="panel-row"><label>必填</label><div class="switch on"></div></div>
    <div class="panel-section">
      <div class="panel-section-title">数据源</div>
      <label class="check"><input type="checkbox">允许清空</label>
      <label class="check"><input type="checkbox">设为查询条件</label>
      <label class="check"><input type="checkbox">在列表中显示</label>
    </div>
  </aside>
</div>
</body>
</html>
